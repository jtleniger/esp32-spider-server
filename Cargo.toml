[package]
name = "esp32-spider-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"          # askama 0.16 MSRV; local rustc is 1.98.1

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
askama = "0.16"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }  # http only; no TLS
chrono = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
