{% extends "base.html" %}
{% block title %}Home — ESP32 Spider Control{% endblock %}
{% block content %}
{{ health_html|safe }}

<h2>Mode</h2>
<div class="panel">
  <form hx-post="/mode" hx-target="#health" hx-swap="outerHTML">
    {{ mode_buttons_html|safe }}
    <div class="channel-row">
      <label for="channel">Single channel</label>
      <select id="channel" name="c">
        {% for c in channels %}<option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>
      <button name="m" value="1">Apply</button>
    </div>
  </form>
  <button hx-post="/logs/clear" hx-target="#health" hx-swap="outerHTML" hx-confirm="Delete every log file on the spider and all locally stored history?">Clear logs</button>
</div>
{% endblock %}
